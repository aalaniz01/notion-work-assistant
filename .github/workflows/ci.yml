name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nwa
          POSTGRES_USER: nwa_ci
          POSTGRES_PASSWORD: nwa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nwa_ci -d nwa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nwa_ci:nwa_ci@127.0.0.1:5432/nwa
      TEST_DATABASE_URL: postgresql://nwa_ci:nwa_ci@127.0.0.1:5432/nwa_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create isolated test database
        run: docker exec "${{ job.services.postgres.id }}" psql -U nwa_ci -d postgres -c "CREATE DATABASE nwa_test"

      - name: Apply application migrations
        run: pnpm db:migrate

      - name: Run all checks
        run: pnpm check:all
