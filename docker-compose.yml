services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Local development values only. Production must provide its own secrets.
      POSTGRES_DB: nwa
      POSTGRES_USER: nwa
      POSTGRES_PASSWORD: nwa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nwa -d nwa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
